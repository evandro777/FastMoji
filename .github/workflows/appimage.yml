name: AppImage

# Builds the AppImage (and its .zsync for delta updates) on every push to master and on pull requests,
# and adds both to the GitHub release when a version tag (v0.2.0, ...) is pushed.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AppImage
    # Oldest runner on offer: the binary runs on any distro with a glibc at least as new.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "${GITHUB_REF_NAME#v}" = "$crate" ] || { echo "tag != Cargo.toml $crate"; exit 1; }

      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxcb1-dev

      - name: appimagetool
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          # No FUSE on the runner: unpack instead of running the AppImage directly.
          ./appimagetool --appimage-extract >/dev/null
          sudo ln -s "$PWD/squashfs-root/AppRun" /usr/local/bin/appimagetool

      - name: Build
        run: appimage/build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: appimage-x86_64
          path: |
            FastMoji-*.AppImage
            FastMoji-*.AppImage.zsync

  release:
    name: Add to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: appimage-x86_64
      # flatpak.yml creates the release; wait for it instead of racing it.
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 60); do
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            sleep 30
          done
          gh release upload "$GITHUB_REF_NAME" FastMoji-*.AppImage* --repo "$GITHUB_REPOSITORY" --clobber
