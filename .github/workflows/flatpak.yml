name: Flatpak

# Builds the Flatpak bundle on every push to master and on pull requests, and publishes it as a
# GitHub release asset when a version tag (v0.2.0, ...) is pushed.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ID: io.github.evandro777.FastMoji

jobs:
  bundle:
    name: Build bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the version files
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "$version" = "$crate" ] || { echo "tag $version != Cargo.toml $crate"; exit 1; }
          grep -q "<release version=\"$version\"" flatpak/$APP_ID.metainfo.xml \
            || { echo "metainfo has no <release> entry for $version"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable

      - name: Flatpak tooling and SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08

      - name: Cache flatpak-builder state
        uses: actions/cache@v4
        with:
          path: flatpak/.flatpak-builder
          key: flatpak-builder-${{ hashFiles('Cargo.lock', 'flatpak/*.yml') }}
          restore-keys: flatpak-builder-

      - name: Build
        run: flatpak/build.sh --bundle

      - name: Name the bundle
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || version="${GITHUB_SHA::8}"
          mv flatpak/fastmoji.flatpak "FastMoji-${version}-x86_64.flatpak"
          sha256sum "FastMoji-${version}-x86_64.flatpak" > "FastMoji-${version}-x86_64.flatpak.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-x86_64
          path: |
            FastMoji-*.flatpak
            FastMoji-*.flatpak.sha256

  release:
    name: Publish release
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flatpak-x86_64
      # The gh CLI on the runner instead of a third-party action: this job can write to the repo.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" FastMoji-*.flatpak FastMoji-*.flatpak.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
