[package]
name = "fastmoji"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Light and fast emoji picker built in Rust with Slint."
homepage = "https://github.com/evandro777/FastMoji"
readme = "../../README.md"
keywords = ["emoji", "picker", "slint", "linux"]
categories = ["gui"]

[dependencies]
fastmoji-core = { path = "../core" }
slint = { version = "1.19", default-features = false, features = ["std", "backend-winit", "renderer-software", "software-renderer-systemfonts", "compat-1-2", "unstable-winit-030"] }
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
x11rb = { version = "0.14", features = ["xtest", "xkb"] }
rustybuzz = "0.20"
ttf-parser = "0.25"
png = "0.18"

[build-dependencies]
slint-build = "1.19"
